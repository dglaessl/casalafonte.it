name: Update availability

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Airbnb calendar
        env:
          AIRBNB_ICAL: ${{ secrets.AIRBNB_ICAL }}
        run: python scripts/ical_to_busy.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet busy.json; then
            git config user.name "availability-bot"
            git config user.email "actions@users.noreply.github.com"
            git add busy.json
            git commit -m "Update availability"
            git push
          fi
